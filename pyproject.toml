[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polarity-circuits"
version = "0.0.1"
description = "Natural-logic monotonicity engine and interpretability experiments for small language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JOSEPH A FALCEY", email = "josephfalcey@gmail.com" }]
keywords = ["natural logic", "monotonicity", "interpretability", "causal abstraction", "semantics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
interp = [
  "torch>=2.3",
  "transformers>=4.44",
  "datasets>=2.20",
  "accelerate>=0.33",
  "pyvene>=0.1.8",
  "transformer-lens>=2.0",
  "sae-lens>=5.0",
]
kan = ["efficient-kan>=0.1.2"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.11", "pre-commit>=3.7"]
paper = ["pyyaml>=6.0", "matplotlib>=3.8", "pandas>=2.2"]

[project.scripts]
polarity-circuits = "polarity_circuits.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["polarity_circuits"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# The engine is the part that must be airtight: full annotation discipline.
[[tool.mypy.overrides]]
module = "polarity_circuits.natlog.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
